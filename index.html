h1{font-family:Poppins,sans-serif;font-weight:500;font-size:34px;margin:6px 0 4px;letter-spacing:.04em}
header p{margin:0;color:var(--mute);font-size:13px}
main{max-width:520px;margin:0 auto;padding:0 16px}
h2{font-family:Poppins,sans-serif;font-weight:500;font-size:18px;margin:30px 4px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.item,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between}
.item h3{margin:0 0 3px;font-size:15px;font-weight:600}
.item p,.hint{margin:0;font-size:12.5px;color:var(--mute);line-height:1.4}
.price{font-size:13px;font-weight:600;margin-top:6px;color:var(--accent)}
.qty{display:flex;align-items:center;gap:10px;flex-shrink:0}
.qty button,.rm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.qty button.add{background:var(--accent);border-color:var(--accent);color:#fff}
.qty span{min-width:14px;text-align:center;font-weight:600}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.step{margin-top:16px}
.step b{font-size:13.5px}
.step small{color:var(--mute);font-size:12px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#addp{width:100%;margin-top:18px;padding:13px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
#addp:disabled{opacity:.4}
.line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.line:last-child{border:0}
.line small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.rm{width:28px;height:28px;font-size:15px;flex-shrink:0}
.pay-t{font-weight:600;font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none}
#bar.show{display:block}
#order{display:block;width:100%;max-width:520px;margin:0 auto;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:15px;cursor:pointer}
footer{text-align:center;color:var(--mute);font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="logo" role="img" aria-label="Takimeshi"></div>
  <h1>Takimeshi</h1>
  <p>Poke bowls · Hecho con Pura Alma · Coyoacán</p>
</header>
<main>
  <h2>Crea tu poke</h2>
  <div class="card">
    <div class="seg" id="size"></div>
    <div id="steps"></div>
    <button id="addp" onclick="addPoke()"></button>
  </div>

  <h2>Favoritos de la casa</h2><div id="fav"></div>
  <h2>Otros</h2><div id="otros"></div>
  <p class="hint" style="margin:-2px 4px 0">Pregunta por más opciones.</p>
  <h2>Bebidas</h2><div id="bebidas"></div>

  <div id="resumen" style="display:none"><h2>Tu pedido</h2><div class="card" id="lines"></div>
    <div class="card"><div class="pay-t">Método de pago</div><div class="chips" id="pay"></div><p class="hint" id="payhint" style="display:none;color:var(--accent);margin-top:8px">Elige un método de pago para continuar.</p></div></div>
</main>
<footer>@takimeshi_</footer>
<div id="bar"><button id="order"></button></div>
<script>
// Cambia este número por el WhatsApp del negocio (con código de país, sin + ni espacios)
var WHATSAPP = "525618695115";
var PRICE = {m:169, g:219}, NAME = {m:"Mediano", g:"Grande"};
var STEPS = [
  {k:"base", t:"1 · Base", lim:{m:1,g:1}, o:["Arroz blanco","Arroz blanco + quinoa"]},
  {k:"prot", t:"2 · Proteína", lim:{m:1,g:2}, o:["Salmón","Atún","Camarón","Pollo","Surimi"]},
  {k:"top", t:"3 · Toppings", min:2, lim:{m:6,g:6}, o:["Pepino","Zanahoria","Col morada","Elotitos","Edamames","Chiles toreados"]},
  {k:"crun", t:"4 · Crujientes", lim:{m:2,g:3}, o:["Cebollas crunchy","Cacahuates","Alga nori","Semillas de girasol","Semillas de calabaza"]},
  {k:"ext", t:"5 · Extras", lim:null, o:["Guacamole","Mango","Brócoli","Queso crema","Tampico","Salsa"]}
];
var SIMPLE = [
  {id:"e", sec:"fav", n:"El especial", d:"Grande · atún y salmón marinado, pepino, zanahoria, edamames, cacahuates y alga nori + mango y tampico.", p:255},
  {id:"t", sec:"fav", n:"Taki Chiloso", d:"Grande · camarones picosos, pepino, zanahoria, col morada, edamames, chiles toreados, cacahuates, cebollitas crunchy + guacamole.", p:235},
  {id:"c", sec:"fav", n:"Cheeto Fresh", d:"Mediano · pollito a la plancha, todos los vegetales de la barra, semillas y cebollitas crunchy + mango.", p:185},
  {id:"o1", sec:"otros", n:"Avena bowl", p:70},
  {id:"o2", sec:"otros", n:"Croissant pavo y queso", p:70},
  {id:"o3", sec:"otros", n:"Croissant dulcito", p:70},
  {id:"o4", sec:"otros", n:"Arroz con leche", p:40},
  {id:"b1", sec:"bebidas", n:"Refresco", p:35},
  {id:"b2", sec:"bebidas", n:"Agua gasificada", p:35},
  {id:"b3", sec:"bebidas", n:"Sodas de sabor", p:40},
  {id:"b4", sec:"bebidas", n:"Agua de coco", p:40},
  {id:"b5", sec:"bebidas", n:"Café del día", p:35}
];
var EXTRA = {"Guacamole":16,"Mango":16,"Brócoli":16,"Queso crema":21,"Tampico":21,"Salsa":11};
var PAYS = ["Efectivo","Transferencia","Tarjeta"], pay = "";
var size = "m", sel = {base:[],prot:[],top:[],crun:[],ext:[]}, cart = {}, n = 0;

function renderBuilder(){
  document.getElementById("size").innerHTML = ["m","g"].map(function(s){
    return '<button class="'+(size===s?"on":"")+'" onclick="setSize(\''+s+'\')">'+NAME[s]+' · $'+PRICE[s]+'</button>';
  }).join("");
  document.getElementById("steps").innerHTML = STEPS.map(function(st){
    var l = st.lim ? st.lim[size] : 0;
    return '<div class="step"><b>'+st.t+'</b><small>'+(st.min?'elige de '+st.min+' a '+l:l?'elige '+l:'opcional')+'</small><div class="chips">'+
      st.o.map(function(o){return '<button class="chip'+(sel[st.k].indexOf(o)>-1?" on":"")+'" onclick="pick(\''+st.k+'\',\''+o+'\')">'+o+(EXTRA[o]?' +$'+EXTRA[o]:'')+'</button>'}).join("")+'</div></div>';
  }).join("");
  var ok = sel.base.length && sel.prot.length && sel.top.length>=2;
  var b = document.getElementById("addp");
  b.disabled = !ok;
  b.textContent = ok ? "Agregar poke · $"+pokePrice() : "Elige base, proteína y mínimo 2 toppings";
}
function pokePrice(){ return PRICE[size] + sel.ext.reduce(function(a,o){return a+EXTRA[o]},0); }
function setSize(s){
  size = s;
  STEPS.forEach(function(st){ if(st.lim) sel[st.k] = sel[st.k].slice(-st.lim[s]); });
  renderBuilder();
}
function pick(k,o){
  var st = STEPS.filter(function(x){return x.k===k})[0], a = sel[k], i = a.indexOf(o);
  if(i>-1) a.splice(i,1); else { a.push(o); if(st.lim && a.length>st.lim[size]) a.shift(); }
  renderBuilder();
}
function addPoke(){
  var d = "Base: "+sel.base.join(", ")+" · Proteína: "+sel.prot.join(", ")+" · Toppings: "+sel.top.join(", ");
  if(sel.crun.length) d += " · Crujientes: "+sel.crun.join(", ");
  if(sel.ext.length) d += " · Extras: "+sel.ext.join(", ");
  cart["p"+(++n)] = {n:"Poke "+NAME[size].toLowerCase(), d:d, p:pokePrice(), q:1};
  sel = {base:[],prot:[],top:[],crun:[],ext:[]};
  renderBuilder(); renderCart();
}
function renderSimple(){
  ["fav","otros","bebidas"].forEach(function(s){
    document.getElementById(s).innerHTML = SIMPLE.filter(function(i){return i.sec===s}).map(function(i){
      var q = cart[i.id] ? cart[i.id].q : 0;
      return '<div class="item"><div><h3>'+i.n+'</h3>'+(i.d?'<p>'+i.d+'</p>':'')+'<div class="price">$'+i.p+'</div></div>'+
        '<div class="qty">'+(q?'<button onclick="chg(\''+i.id+'\',-1)">−</button><span>'+q+'</span>':'')+
        '<button class="add" onclick="chg(\''+i.id+'\',1)">+</button></div></div>';
    }).join("");
  });
}
function chg(id,d){
  var it = SIMPLE.filter(function(x){return x.id===id})[0];
  var c = cart[id] || (cart[id] = {n:it.n, p:it.p, q:0});
  c.q += d; if(c.q<=0) delete cart[id];
  renderCart();
}
function setPay(o){ pay = o; document.getElementById("payhint").style.display="none"; renderPay(); }
function renderPay(){
  document.getElementById("pay").innerHTML = PAYS.map(function(o){
    return '<button class="chip'+(pay===o?" on":"")+'" onclick="setPay(\''+o+'\')">'+o+'</button>';
  }).join("");
}
function rm(k){ delete cart[k]; renderCart(); }
function renderCart(){
  renderSimple(); renderPay();
  var ks = Object.keys(cart), cnt = 0, tot = 0;
  ks.forEach(function(k){cnt += cart[k].q; tot += cart[k].q*cart[k].p});
  document.getElementById("resumen").style.display = ks.length ? "block" : "none";
  document.getElementById("lines").innerHTML = ks.map(function(k){
    var c = cart[k];
    return '<div class="line"><div>'+c.q+' × '+c.n+' · $'+(c.q*c.p)+(c.d?'<small>'+c.d+'</small>':'')+'</div><button class="rm" onclick="rm(\''+k+'\')">×</button></div>';
  }).join("");
  document.getElementById("bar").className = cnt ? "show" : "";
  document.getElementById("order").textContent = "Ordenar por WhatsApp · "+cnt+" · $"+tot;
}
document.getElementById("order").onclick = function(){
  if(!pay){ document.getElementById("payhint").style.display="block"; document.getElementById("resumen").scrollIntoView({behavior:"smooth"}); return; }
  var t = 0, lines = Object.keys(cart).map(function(k){
    var c = cart[k]; t += c.q*c.p;
    return "• "+c.q+" x "+c.n+(c.d?" ("+c.d+")":"");
  });
  var msg = "Hola Takimeshi, quiero ordenar:\n"+lines.join("\n")+"\nTotal: $"+t+"\nMétodo de pago: "+pay;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg), "_blank");
};
renderBuilder(); renderCart();
</script>
</body>
</html>
